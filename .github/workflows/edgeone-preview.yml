name: EdgeOne preview deployment

on:
  push:
    branches: [feature/4k-danmaku-source]
    paths:
      - "danmu_api/**"
      - "node-functions/**"
      - "edgeone.json"
      - "package.json"
      - ".github/workflows/edgeone-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout tested feature branch
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify EdgeOne CLI
        run: npx --yes edgeone@latest --version
      - name: Deploy isolated preview to EdgeOne Pages
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${EDGEONE_API_TOKEN:-}" ]; then
            echo "EDGEONE_API_TOKEN repository secret is not configured."
            exit 1
          fi
          npx --yes edgeone@latest pages deploy ./ -n danmu-api -e preview -t "$EDGEONE_API_TOKEN"
