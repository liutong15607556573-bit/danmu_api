name: 4K live source probe

on:
  push:
    branches: [feature/4k-danmaku-source]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe real 4K playback page and its own danmaku endpoint
        env:
          PLAY_URL: https://www.4kvm.net/play/ch4s99p1u
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const response = await fetch(process.env.PLAY_URL, { headers: { 'User-Agent': 'Mozilla/5.0' }, signal: AbortSignal.timeout(20000) });
          if (!response.ok) throw new Error('Playback page HTTP ' + response.status);
          const html = await response.text();
          const player = html.match(/<[^>]*data-danmaku-api-url=["']([^"']+)["'][^>]*data-danmaku-enabled=["']true["'][^>]*>/i)
            || html.match(/<[^>]*data-danmaku-enabled=["']true["'][^>]*data-danmaku-api-url=["']([^"']+)["'][^>]*>/i);
          const video = html.match(/id=["']player-error-message-detail["'][^>]*data-v-id=["'](\d+)["']/i)
            || html.match(/data-v-id=["'](\d+)["'][^>]*id=["']player-error-message-detail["']/i);
          const manager = html.match(/x-data=["']episodeManager\(\s*\d+\s*,\s*(\d+)\s*,/i);
          const title = (html.match(/<title[^>]*>([\s\S]*?)<\/title>/i)?.[1] || 'not found').replace(/\s+/g,' ').slice(0,120);
          console.log('Playback page HTTP:', response.status);
          console.log('Page title:', title);
          if (!player || !video || !manager) throw new Error('Playback page metadata extraction failed');
          const apiRoot = new URL(player[1], process.env.PLAY_URL);
          if (apiRoot.hostname !== '4k.dmservce.org') throw new Error('Unexpected danmaku API host: ' + apiRoot.hostname);
          const endpoint = apiRoot.toString().replace(/\/$/, '') + '/video/' + video[1] + '.' + manager[1];
          console.log('Extracted video ID:', video[1]);
          console.log('Extracted episode:', manager[1]);
          console.log('Requesting page-derived endpoint:', endpoint);
          const dmResponse = await fetch(endpoint, { headers: { 'User-Agent': 'Mozilla/5.0', 'Accept': 'application/json,*/*' }, signal: AbortSignal.timeout(20000) });
          if (!dmResponse.ok) throw new Error('Danmaku API HTTP ' + dmResponse.status);
          const payload = await dmResponse.json();
          console.log('Danmaku API HTTP:', dmResponse.status);
          console.log('API code:', payload.code);
          console.log('Danmaku item count:', Array.isArray(payload.data) ? payload.data.length : 'NOT AN ARRAY');
          console.log('Sample item:', JSON.stringify(payload.data?.[0] ?? null));
          if (payload.code !== 0 || !Array.isArray(payload.data)) throw new Error('Danmaku API payload shape invalid');
          console.log('LIVE PROBE PASSED: this playback page and its own episode endpoint work.');
          NODE
